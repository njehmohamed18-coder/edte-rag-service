services:
  neo4j:
    image: neo4j:5.18-community
    container_name: edte-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/edte_password
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: edte-rag-service
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=edte_password
    depends_on:
      neo4j:
        condition: service_healthy
